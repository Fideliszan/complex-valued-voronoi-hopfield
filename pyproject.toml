[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cvhnn"
dynamic = ["version"]
description = "Computational companion: Voronoi-based activation functions and inertial energy for complex-valued Hopfield networks"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "scipy>=1.13,<2",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<0.14",
    "plotnine>=0.15,<0.16",
    "Pillow>=10,<14",
    "threadpoolctl>=3.2,<4",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
    "ipykernel>=6.29,<8",
]

[tool.setuptools.dynamic]
version = { file = "RELEASE_VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "scripts"]
# Generated notebooks and the frozen manuscript-packaging scripts are not linted.
extend-exclude = ["colab", "runs", "scripts/build_overleaf.py", "scripts/build_anonymous_review.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The Matplotlib backend must be selected before pyplot is imported.
"scripts/render_figures.py" = ["E402"]
"scripts/render_geometry.py" = ["E402"]
